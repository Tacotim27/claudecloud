<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Makima</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1a0508; font-family: system-ui, sans-serif; }
  canvas { display: block; }
  #hint {
    position: fixed; left: 0; right: 0; bottom: 14px; text-align: center;
    color: #e8b9a8; font-size: 13px; letter-spacing: .08em; pointer-events: none; opacity: .8;
  }
</style>
<script type="importmap">
{ "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="hint">drag to rotate · scroll to zoom · right-drag to pan</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ---------- scene ----------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x2a0a10);
scene.fog = new THREE.Fog(0x2a0a10, 5, 12);

const camera = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, 0.1, 50);
camera.position.set(0.6, 1.5, 3.4);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.0, 0);
controls.enableDamping = true;
controls.minDistance = 0.8;
controls.maxDistance = 8;
controls.maxPolarAngle = Math.PI * 0.52;
if (new URLSearchParams(location.search).has('close')) { camera.position.set(0.15, 1.68, 0.8); controls.target.set(0, 1.58, 0); }
controls.update();

// lights
scene.add(new THREE.HemisphereLight(0xffe6d8, 0x3a0d14, 0.9));
const key = new THREE.DirectionalLight(0xfff0e6, 2.2);
key.position.set(2, 3.5, 3);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -1.5; key.shadow.camera.right = 1.5;
key.shadow.camera.top = 2.5; key.shadow.camera.bottom = -0.5;
key.shadow.bias = -0.0005;
scene.add(key);
const rim = new THREE.DirectionalLight(0xff4a3a, 1.6);
rim.position.set(-3, 2.5, -3);
scene.add(rim);

// floor
const floor = new THREE.Mesh(
  new THREE.CircleGeometry(3, 64),
  new THREE.MeshStandardMaterial({ color: 0x14070a, roughness: 0.85 })
);
floor.rotation.x = -Math.PI / 2;
floor.receiveShadow = true;
scene.add(floor);

// ---------- materials ----------
const mat = (color, rough = 0.7, extra = {}) =>
  new THREE.MeshStandardMaterial({ color, roughness: rough, metalness: 0, ...extra });
const skin   = mat(0xf2d3c0, 0.65);
const hairM  = mat(0xb34a26, 0.5);
const hairD  = mat(0x8f3818, 0.55);
const shirt  = mat(0xf4f1ec, 0.8);
const black  = mat(0x101012, 0.6);
const lips   = mat(0xc98080, 0.5);

function mesh(geo, material, { pos, rot, scl, parent } = {}) {
  const m = new THREE.Mesh(geo, material);
  if (pos) m.position.set(...pos);
  if (rot) m.rotation.set(...rot);
  if (scl) m.scale.set(...scl);
  m.castShadow = true;
  m.receiveShadow = true;
  (parent || makima).add(m);
  return m;
}

const makima = new THREE.Group();
scene.add(makima);

// ---------- legs & shoes ----------
for (const s of [-1, 1]) {
  mesh(new THREE.CylinderGeometry(0.088, 0.062, 0.84, 24), black, { pos: [s * 0.093, 0.5, 0] });
  // shoe
  mesh(new THREE.CapsuleGeometry(0.052, 0.14, 8, 16), black,
       { pos: [s * 0.095, 0.045, 0.06], rot: [Math.PI / 2, 0, 0], scl: [1, 1, 0.65] });
}

// ---------- hips + torso ----------
mesh(new THREE.CylinderGeometry(0.125, 0.17, 0.22, 32), black, { pos: [0, 0.97, 0], scl: [1, 1, 0.68] });
mesh(new THREE.CylinderGeometry(0.125, 0.115, 0.45, 32), shirt, { pos: [0, 1.185, 0], scl: [1, 1, 0.68] });
// upper chest / shoulder line
mesh(new THREE.SphereGeometry(0.13, 32, 16), shirt, { pos: [0, 1.4, 0], scl: [1.3, 0.42, 0.72] });
// belt
mesh(new THREE.CylinderGeometry(0.138, 0.138, 0.03, 32), mat(0x050505, 0.4), { pos: [0, 1.08, 0], scl: [1, 1, 0.68] });
mesh(new THREE.BoxGeometry(0.035, 0.03, 0.01), mat(0xb8a37a, 0.3, { metalness: 0.8 }), { pos: [0, 1.08, 0.098] });

// bust (subtle)
for (const s of [-1, 1]) {
  mesh(new THREE.SphereGeometry(0.058, 24, 16), shirt, { pos: [s * 0.055, 1.31, 0.05], scl: [1, 0.95, 0.85] });
}

// trapezius
mesh(new THREE.SphereGeometry(0.075, 24, 12), shirt, { pos: [0, 1.445, -0.005], scl: [1.7, 0.5, 0.95] });

// shoulders
for (const s of [-1, 1]) {
  mesh(new THREE.SphereGeometry(0.052, 20, 16), shirt, { pos: [s * 0.165, 1.405, 0] });
}

// neck
mesh(new THREE.CylinderGeometry(0.036, 0.042, 0.1, 20), skin, { pos: [0, 1.5, 0] });

// collar
for (const s of [-1, 1]) {
  mesh(new THREE.BoxGeometry(0.075, 0.035, 0.012), shirt,
       { pos: [s * 0.032, 1.465, 0.04], rot: [0.25, s * -0.45, s * -0.35] });
}
mesh(new THREE.TorusGeometry(0.045, 0.012, 8, 24), shirt, { pos: [0, 1.46, -0.005], rot: [Math.PI / 2, 0, 0], scl: [1, 1, 1] });

// tie
mesh(new THREE.BoxGeometry(0.03, 0.036, 0.02), black, { pos: [0, 1.435, 0.062], rot: [0.28, 0, 0] });
const tie = mesh(new THREE.CylinderGeometry(0.014, 0.024, 0.28, 4, 1), black,
                 { pos: [0, 1.285, 0.088], rot: [0.12, Math.PI / 4, 0], scl: [1, 1, 0.35] });

// ---------- arms ----------
for (const s of [-1, 1]) {
  const arm = new THREE.Group();
  arm.position.set(s * 0.175, 1.4, 0);
  arm.rotation.z = s * 0.1;
  makima.add(arm);
  mesh(new THREE.CapsuleGeometry(0.04, 0.28, 8, 16), shirt, { parent: arm, pos: [0, -0.2, 0] });
  const fore = new THREE.Group();
  fore.position.set(0, -0.37, 0);
  fore.rotation.x = -0.18;
  arm.add(fore);
  mesh(new THREE.CapsuleGeometry(0.033, 0.22, 8, 16), shirt, { parent: fore, pos: [0, -0.14, 0] });
  // cuff + hand
  mesh(new THREE.CylinderGeometry(0.036, 0.036, 0.03, 16), shirt, { parent: fore, pos: [0, -0.285, 0] });
  mesh(new THREE.SphereGeometry(0.04, 16, 12), skin, { parent: fore, pos: [0, -0.34, 0], scl: [0.85, 1.4, 0.6] });
}

// ---------- head ----------
const head = new THREE.Group();
head.position.set(0, 1.62, 0);
makima.add(head);

mesh(new THREE.SphereGeometry(0.1, 48, 32), skin, { parent: head, scl: [0.9, 1.16, 0.96] });
// nose
mesh(new THREE.SphereGeometry(0.011, 12, 8), skin, { parent: head, pos: [0, -0.025, 0.098], scl: [0.8, 1, 1] });

// eyes — concentric ringed irises
function makeEye(side) {
  const g = new THREE.Group();
  g.position.set(side * 0.04, 0.0, 0.0905);
  g.rotation.y = side * 0.38;
  const flat = (geo, color, z) => {
    const m = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({
      color, polygonOffset: true, polygonOffsetFactor: -z * 100, polygonOffsetUnits: -z * 100 }));
    m.position.z = z * 0.0004;
    g.add(m);
  };
  flat(new THREE.CircleGeometry(0.0235, 40), 0xe9c24a, 1);
  flat(new THREE.RingGeometry(0.0185, 0.0205, 40), 0xb8741f, 2);
  flat(new THREE.RingGeometry(0.0125, 0.0145, 40), 0xb8741f, 3);
  flat(new THREE.RingGeometry(0.0065, 0.0082, 40), 0xb8741f, 4);
  flat(new THREE.CircleGeometry(0.0035, 24), 0x2a1204, 5);
  // lid / lash line
  const lid = new THREE.Mesh(new THREE.TorusGeometry(0.0245, 0.0022, 6, 40, Math.PI),
                             new THREE.MeshBasicMaterial({ color: 0x3a1608 }));
  lid.position.z = 0.0035;
  lid.rotation.z = 0.12 * side;
  g.add(lid);
  head.add(g);
}
makeEye(-1); makeEye(1);

// mouth: gentle smile
const mouth = new THREE.Mesh(new THREE.TorusGeometry(0.02, 0.0035, 8, 24, Math.PI * 0.8), lips);
mouth.position.set(0, -0.058, 0.0905);
mouth.rotation.z = Math.PI + (Math.PI - Math.PI * 0.8) / 2 - Math.PI;
mouth.rotation.z = Math.PI * 1.1;
mouth.scale.set(1, 0.55, 1);
head.add(mouth);

// ---------- hair ----------
// cranium
mesh(new THREE.SphereGeometry(0.106, 48, 32), hairM, { parent: head, pos: [0, 0.03, -0.03], scl: [0.98, 1.06, 0.95] });
// back hair mass falling to shoulders
mesh(new THREE.CylinderGeometry(0.085, 0.115, 0.26, 32, 1, true), hairD,
     { parent: head, pos: [0, -0.1, -0.045], scl: [1, 1, 0.9] }).material.side = THREE.DoubleSide;
mesh(new THREE.SphereGeometry(0.1, 32, 16), hairD, { parent: head, pos: [0, -0.1, -0.075], scl: [1.0, 1.35, 0.7] });

// bangs: tufts hanging over the forehead
const bangCount = 9;
for (let i = 0; i < bangCount; i++) {
  const t = i / (bangCount - 1) - 0.5;      // -0.5 .. 0.5
  const ang = t * 1.9;
  const len = 0.085 - Math.abs(t) * 0.03;
  const tuft = mesh(new THREE.ConeGeometry(0.024, len, 10), hairM, {
    parent: head,
    pos: [Math.sin(ang) * 0.088, 0.098 - len / 2, Math.cos(ang) * 0.082],
    scl: [1, 1, 0.5],
  });
  tuft.rotation.order = 'YXZ';
  tuft.rotation.set(Math.PI - 0.3, ang, 0);
}
// side locks framing the face
for (const s of [-1, 1]) {
  mesh(new THREE.CapsuleGeometry(0.017, 0.15, 6, 12), hairM,
       { parent: head, pos: [s * 0.088, -0.045, 0.04], rot: [0.05, 0, s * 0.08] });
  mesh(new THREE.ConeGeometry(0.018, 0.06, 10), hairM,
       { parent: head, pos: [s * 0.09, -0.155, 0.04], rot: [Math.PI, 0, 0] });
}

// ---------- braid over the shoulder ----------
const braidCurve = new THREE.CatmullRomCurve3([
  new THREE.Vector3(-0.085, 1.66, -0.06),
  new THREE.Vector3(-0.14, 1.58, -0.01),
  new THREE.Vector3(-0.17, 1.5, 0.055),
  new THREE.Vector3(-0.155, 1.4, 0.115),
  new THREE.Vector3(-0.125, 1.3, 0.13),
  new THREE.Vector3(-0.1, 1.2, 0.125),
  new THREE.Vector3(-0.09, 1.1, 0.115),
]);
const braid = new THREE.Group();
makima.add(braid);
const segs = 22;
for (let i = 0; i < segs; i++) {
  const u = i / (segs - 1);
  const p = braidCurve.getPoint(u);
  const tan = braidCurve.getTangent(u);
  const r = 0.038 * (1 - u * 0.55);
  // alternate links to suggest the interlocking weave
  const side = i % 2 ? 1 : -1;
  const link = mesh(new THREE.SphereGeometry(r, 16, 12), i % 2 ? hairM : hairD, {
    parent: braid, pos: [p.x + side * 0.006, p.y, p.z],
    scl: [0.85, 0.9, 0.85],
  });
  link.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), tan);
}
// hair tie + tuft at the tip
const tip = braidCurve.getPoint(1);
mesh(new THREE.TorusGeometry(0.017, 0.006, 8, 16), black, { parent: braid, pos: [tip.x, tip.y - 0.005, tip.z], rot: [Math.PI / 2, 0, 0] });
mesh(new THREE.ConeGeometry(0.02, 0.07, 12), hairM, { parent: braid, pos: [tip.x, tip.y - 0.045, tip.z], rot: [Math.PI, 0, 0] });

// ---------- animation ----------
const clock = new THREE.Clock();
function animate() {
  const t = clock.getElapsedTime();
  const breath = Math.sin(t * 1.6) * 0.004;
  makima.position.y = breath * 0.5;
  head.rotation.y = Math.sin(t * 0.5) * 0.12;
  head.rotation.x = Math.sin(t * 0.7) * 0.015;
  braid.rotation.z = Math.sin(t * 0.9) * 0.012;
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(animate);
}
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
